name: CMake on a single platform

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "desktop-client/**"
      - ".github/workflows/cmake-single-platform.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "desktop-client/**"
      - ".github/workflows/cmake-single-platform.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"

env:
  BUILD_TYPE: Release
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonDir: '${{ github.workspace }}/backend'
          vcpkgTriplet: 'x64-linux'
          setupOnly: true

      - name: Export VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg deps
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet=x64-linux \
            --x-install=${{ github.workspace }}/vcpkg/installed

      - name: Configure CMake (via preset)
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
